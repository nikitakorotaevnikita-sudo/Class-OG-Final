version: "3.9"
services:
  classifier:
    build: .
    ports:
      # host 8010 (адрес для разработчика/RX) → внутренний 8005 приложения.
      # При переносе на другую машину порт меняется через HOST_PORT в .env.
      - "${HOST_PORT:-8010}:8005"
    extra_hosts:
      # На Linux Docker нет host.docker.internal по умолчанию. Нужно, чтобы
      # контейнер видел Ollama / vLLM / RX на той же машине.
      # В .env: OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    volumes:
      # Хостовый .env. Без этого бэк-офис пишет настройки в слой образа,
      # и они пропадают при recreate. Файл должен существовать до up
      # (cp .env.example .env) — иначе Docker создаст каталог.
      - ./.env:/app/.env
      # persistent storage for logs and fine-tuned models
      - ./data/appeals_log.jsonl:/app/data/appeals_log.jsonl
      - ./data/request_log.jsonl:/app/data/request_log.jsonl
      - ./data/historical_verified.jsonl:/app/data/historical_verified.jsonl
      - ./data/classifier_annotations.json:/app/data/classifier_annotations.json
      # Фоновые задачи: без монтирования результаты живут только внутри
      # контейнера и пропадают при его пересоздании
      - ./data/jobs:/app/data/jobs
      # Боевая векторная база — на запись: rebuild и apply_adapter из контейнера
      # иначе упираются в Read-only file system, и права приходится чинить руками.
      - ./data/vector_db_adapted_v3:/app/data/vector_db_adapted_v3
      # Adapters and trained components
      - ./models:/app/models
      # Кэш моделей Hugging Face. Контейнер переиспользует веса, уже скачанные
      # на хост; путь машинно-зависимый — задаётся HF_CACHE_DIR в .env.
      # Монтируется на ЗАПИСЬ: при пустом кеше контейнер скачивает
      # multilingual-e5-base (~435 МБ) и должен куда-то её положить. С :ro
      # скачивание падало, даже когда интернет был.
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
      # Allowed-codes whitelist (changes don't require image rebuild)
      - ./data/allowed_codes_top69.json:/app/data/allowed_codes_top69.json:ro
    env_file:
      - .env
    restart: unless-stopped
