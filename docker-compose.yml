# Стек классификатора: PostgreSQL + pgvector (в нём же очередь задач, таблица jobs),
# разовая миграция, тонкий API и воркеры. Запуск: ./start.sh (Linux) / start.cmd (Windows)
# или напрямую `docker compose up -d --build` (+ `--profile training`).
#
# Остановка — `docker compose down` БЕЗ `-v`: том pgdata хранит тексты
# обращений (ПДн по 59-ФЗ) и обязан переживать пересоздание контейнеров.
#
# Код живёт в src/ (корень импорта, модули по пакетам: `from core import config`,
# `worker.run`), поэтому всем прикладным сервисам нужен PYTHONPATH=/app/src.

# Общие настройки прикладных сервисов (migrate, api, воркеры).
x-app-env: &app-env
  # Адреса сервисов внутри compose-сети. Значения из .env (localhost) здесь
  # перекрываются: внутри контейнера localhost — это сам контейнер.
  DATABASE_URL: postgresql://${POSTGRES_USER:-classifier}:${POSTGRES_PASSWORD:-classifier}@postgres:5432/${POSTGRES_DB:-classifier}
  PYTHONPATH: /app/src
  STORAGE_BACKEND: postgres

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classifier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classifier}
      POSTGRES_DB: ${POSTGRES_DB:-classifier}
    volumes:
      # Данные БД — в именованном томе. В Git и в образ не попадают.
      - pgdata:/var/lib/postgresql/data
      # Расширения и схема применяются при первом создании тома.
      # На уже существующем томе схему догоняет сервис migrate (init_db.py).
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Порт на хосте — для режима `start local` и обслуживания (psql).
      # По умолчанию только loopback: в БД ПДн. 0.0.0.0 (POSTGRES_BIND) — лишь
      # для нескольких машин и только после смены POSTGRES_PASSWORD.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classifier} -d ${POSTGRES_DB:-classifier}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Разовый шаг: схема (идемпотентно) + импорт файлового хранилища в БД.
  # После полного успешного переноса в schema_meta пишется отметка, и
  # следующие запуски импорт пропускают (повтор — только вручную с --force).
  # При расхождении сверки выходит с кодом 1, и api не стартует.
  migrate:
    build: .
    command: sh -c "python scripts/db/init_db.py && python scripts/db/migrate_from_files.py"
    env_file: .env
    environment: *app-env
    volumes:
      - ./.env:/app/.env
      # Источники миграции: журналы, аннотации, векторная база VECTOR_DB_DIR
      # (боевая data/vector_db_adapted_v3). Только чтение — файлы не меняются.
      - ./data:/app/data:ro
      # training_report.json дообученных моделей → реестр моделей.
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Тонкий API: без модели эмбеддингов и без файлов с ПДн. Всё — через БД и очередь.
  api:
    build: .
    command: ["uvicorn", "api.api_server:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      # host 8010 (адрес для разработчика/RX) → внутренний 8005 приложения.
      # При переносе на другую машину порт меняется через HOST_PORT в .env.
      - "${HOST_PORT:-8010}:8005"
    extra_hosts:
      # API ходит в RX (rx_client): .env может указывать RX на host.docker.internal.
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment: *app-env
    volumes:
      # Хостовый .env: бэк-офис пишет в него настройки, воркеры подхватывают
      # их на лету. Файл должен существовать до up (cp .env.example .env),
      # иначе Docker создаст на его месте каталог.
      - ./.env:/app/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Воркеры классификации: CLASSIFY_WORKERS реплик, один процесс = одна задача.
  # Без воркеров (воркеры на других машинах) поднимаются только postgres, migrate и api:
  # `docker compose up -d postgres migrate api` (start docker --no-workers).
  worker-classify:
    build: .
    command: python -m worker.run --queues classify_sync,classify
    deploy:
      replicas: ${CLASSIFY_WORKERS:-2}
    env_file: .env
    environment: *app-env
    extra_hosts:
      # На Linux Docker нет host.docker.internal по умолчанию. Нужно, чтобы
      # воркер видел Ollama / vLLM / RX на той же машине.
      # В .env: OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/app/.env
      # Адаптеры, LTR и дообученные модели (активная версия — из реестра в БД).
      - ./models:/app/models
      # Кэш моделей Hugging Face. Путь машинно-зависимый — HF_CACHE_DIR в .env.
      # На запись: при пустом кеше воркер скачивает multilingual-e5-base (~435 МБ).
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
      # Белый список кодов (правка без пересборки образа)
      - ./data/allowed_codes_top69.json:/app/data/allowed_codes_top69.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Дообучение — один процесс, включается профилем: --profile training.
  worker-training:
    build: .
    command: python -m worker.run --queues training
    profiles: [training]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *app-env
    volumes:
      - ./.env:/app/.env
      # Сюда пишутся новые версии модели (models/e5-finetuned-vN).
      - ./models:/app/models
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # GPU для дообучения: раскомментировать на хосте с NVIDIA Container Toolkit
    # и собрать образ с CUDA-torch (--build-arg TORCH_INDEX_URL=.../cu124).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgdata:
