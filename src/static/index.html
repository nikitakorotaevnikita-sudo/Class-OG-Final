<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Иннтелелктуальное обращениее граждан</title>
  <link rel="stylesheet" href="/static/appeal.css?v=20260526">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Directum">
      <img class="brand-logo" src="/static/logo.svg?v=20260526-directum" alt="Directum"
           onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
      <span class="brand-fallback">Directum</span>
    </a>
    <div class="app-title">
      <h1>Иннтелелктуальное обращениее граждан</h1>
    </div>
    <a class="btn btn-ghost" href="/backoffice">Бэк-офис</a>
  </header>

  <aside class="sidebar app-sidebar" aria-label="Разделы">
    <nav class="nav-list" aria-label="Навигация">
      <a href="/" class="nav-item active">Классификация</a>
      <a href="/static/historical.html" class="nav-item">Исторические данные</a>
    </nav>
    <section class="result-section" aria-label="Сводка">
      <h2>Сводка</h2>
      <div id="side-results" class="result-list">
        <div class="result-card">Готов к классификации</div>
      </div>
    </section>
  </aside>

  <main class="appeal-shell">
    <section class="prompt-panel" aria-label="Быстрые настройки">
      <div class="prompt-panel-heading">
        <h2>Быстрый ввод</h2>
        <div class="llm-inline-status" id="llm-status">LLM: загрузка...</div>
      </div>
      <div class="runtime-grid">
        <label class="field">
          <span>Пример обращения</span>
          <select id="examples-select">
            <option value="">Выберите пример</option>
          </select>
        </label>
        <label class="field">
          <span>LLM provider</span>
          <select id="llm-provider">
            <option value="ario">Ario</option>
            <option value="groq">Groq</option>
            <option value="gemini">Gemini</option>
            <option value="ollama">Ollama</option>
          </select>
        </label>
        <label class="field">
          <span>LLM model</span>
          <input id="llm-model" list="llm-models" autocomplete="off">
          <datalist id="llm-models"></datalist>
        </label>
      </div>
    </section>

    <section class="appeal-workspace">
      <section class="tool-section input-panel" aria-label="Текст обращения">
        <div class="section-heading">
          <div>
            <h2>Обращение</h2>
            <p>TXT или PDF до 5 МБ, либо текст вручную.</p>
          </div>
        </div>

        <label class="field file-field">
          <span>Файл</span>
          <input type="file" id="file-input" accept=".txt,.pdf,text/plain,application/pdf">
        </label>

        <label class="field appeal-text-field">
          <span>Текст обращения</span>
          <textarea id="appeal-text" rows="14" placeholder="Вставьте или введите текст обращения..."></textarea>
        </label>

        <div class="button-row">
          <button id="classify-btn" class="btn" type="button">Классифицировать</button>
          <button id="clear-btn" class="btn btn-ghost" type="button">Очистить</button>
        </div>

        <div id="loading" class="hidden loading-line">
          <span class="spinner"></span>
          <span>Классификация...</span>
        </div>
      </section>

      <section id="result" class="tool-section result-panel hidden" aria-label="Результат">
        <div class="section-heading">
          <div>
            <h2>Результат</h2>
            <p id="overall-confidence"></p>
          </div>
        </div>

        <div id="result-meta" class="meta-grid"></div>

        <div id="needs-verification" class="hidden alert alert-amber">
          Требует верификации оператором
        </div>

        <div id="questions" class="questions-list"></div>

        <div class="verify-row">
          <button id="btn-confirm" class="btn btn-green" type="button">Подтвердить</button>
          <button id="btn-correct" class="btn btn-amber" type="button">Исправить</button>
          <button id="btn-reject" class="btn btn-red" type="button">Отклонить</button>
        </div>

        <div id="correct-form" class="hidden edit-form">
          <label class="field">
            <span>Правильный код вопроса</span>
            <input id="correct-code" type="text" placeholder="0005.0005.0051.1103">
          </label>
          <label class="field">
            <span>Пояснение к коду</span>
            <textarea id="correct-annotation" rows="3" placeholder="Опишите, почему выбран этот код..."></textarea>
          </label>
          <div id="annotation-hint" class="hidden edit-form-hint">Минимум 10 символов</div>
          <button id="btn-correct-save" class="btn btn-amber" type="button">Сохранить исправление</button>
        </div>

        <details class="json-details">
          <summary>JSON ответа</summary>
          <pre id="json-pre" class="json-pre"></pre>
        </details>
      </section>
    </section>
  </main>

  <div id="toast" class="hidden toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
