# RabbitMQ settings for the classifier (mounted read-only into the compose
# rabbitmq service as /etc/rabbitmq/conf.d/20-classifier.conf).
#
# consumer_timeout: how long a delivered, not yet acknowledged message may stay
# with a consumer. Tasks are acked late (after completion); the RabbitMQ default
# of 30 min would close the channel during long classifications and hours-long
# fine-tuning and redeliver the task. 24 h = 86400000 ms.
# Native (non-docker) RabbitMQ installs: put the same line into rabbitmq.conf.
consumer_timeout = 86400000
